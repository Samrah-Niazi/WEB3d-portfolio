<!doctype html>
<html lang="en" data-palette="maroon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Samrah Niazi, game developer: Unity, Unreal, AR/VR projects and an AI assistant." />
    <meta name="theme-color" content="#0C0D0F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>Samrah Niazi | Game Developer Portfolio</title>
    <script>
      try {
        // New visitors always get the dark maroon look. Only a choice made on this version of the site is remembered (pf- keys), so settings saved by older versions are ignored.
        var r = document.documentElement;
        if (localStorage.getItem("pf-theme") === "light") r.dataset.theme = "light";
        var p = localStorage.getItem("pf-palette");
        r.dataset.palette = ["maroon", "noir", "emerald", "sunset"].indexOf(p) >= 0 ? p : "maroon";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
